[project]
name = "handeye"
version = "0.1.0"
description = "手眼标定 demo — Hand-Eye Calibration learning project"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.1",
]

[tool.setuptools.package-data]
handeye = ["*.py"]
